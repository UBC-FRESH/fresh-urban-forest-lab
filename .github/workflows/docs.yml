name: Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r docs/requirements.txt

      - name: Build documentation
        run: sphinx-build -b html docs _build/html -W

      - name: Upload the documentation artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _build/html

      # Pages deployment is a Phase 5 approval gate. Add the deploy job only after
      # the maintainer enables Pages for the repository.
