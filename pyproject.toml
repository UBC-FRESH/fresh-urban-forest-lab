[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fresh-urban-forest"
version = "0.3.0"
description = "Open urban-forest LiDAR, tree-inventory, growth, and 3D decision-support lab"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "UBC FRESH Lab" }]
keywords = ["urban forest", "lidar", "tree inventory", "canopy", "decision support", "3d"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "rasterio>=1.3",
  "geopandas>=0.14",
  "laspy>=2.5",
  "lazrs>=0.5",
  "pyproj>=3.6",
  "shapely>=2.0",
  "scipy>=1.11",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.7",
  "pillow>=10",
]

[project.optional-dependencies]
fvs = ["fresh-fvsbc>=0.20.0"]
optimize = ["fresh-solutions @ git+https://github.com/UBC-FRESH/fresh-solutions.git@v0.8.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "pillow>=10"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "coverage>=7.5",
  "ruff>=0.6",
  "mypy>=1.11",
  "numpydoc>=1.7",
  "hypothesis>=6.100",
  "pre-commit>=3.7",
  "playwright>=1.45",
]

[project.scripts]
fresh-urban-forest = "fresh_urban_forest.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fresh_urban_forest = [
  "resources/*.yaml",
  "resources/*.json",
  "web/static/*",
  "web/static/vendor/*",
  "web/static/vendor/three/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]
extend-exclude = ["tmp", "_build", "data", "src/fresh_urban_forest/web/static/vendor"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D", "ANN", "N", "PT", "SIM", "RUF", "C4"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101"]
"docs/conf.py" = ["D", "ANN", "N"]
"src/fresh_urban_forest/web/static/**" = ["D", "ANN", "N", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src", "scripts", "tests", "docs/conf.py"]

[[tool.mypy.overrides]]
module = ["fresh_solutions", "fresh_solutions.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "rasterio",
  "rasterio.*",
  "geopandas",
  "geopandas.*",
  "laspy",
  "laspy.*",
  "shapely",
  "shapely.*",
  "pyproj",
  "pyproj.*",
  "yaml",
  "fastapi",
  "fastapi.*",
  "uvicorn",
  "uvicorn.*",
  "starlette",
  "starlette.*",
  "numpydoc",
  "numpydoc.*",
  "scipy",
  "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/fresh_urban_forest --cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=85"
markers = [
  "network: tests that need network access",
  "browser: tests that drive a browser",
]

[tool.coverage.run]
branch = true
source = ["src/fresh_urban_forest", "scripts"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']
